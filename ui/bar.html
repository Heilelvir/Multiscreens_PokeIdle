<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  :root {
    --bg: #161019; --panel: #241a2e; --panel-hover: #31233f; --line: #43345a;
    --text: #ece6f2; --muted: #a99bbd; --accent: #8b6cff; --ok: #2fa866; --live: #ff6b6b;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12.5px "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none;
  }
  #bar {
    display: flex; align-items: center; justify-content: flex-start; /* troque por flex-end para alinhar à direita */
    gap: 4px; height: 36px; padding: 0 8px; box-sizing: border-box; border-bottom: 1px solid var(--line);
  }
  .group { display: flex; align-items: center; gap: 4px; }
  .divider { width: 1px; height: 18px; background: var(--line); margin: 0 8px; }
  button {
    display: inline-flex; align-items: center; height: 26px; padding: 0 11px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    font: inherit; cursor: pointer; transition: background .12s, border-color .12s;
  }
  button:hover { background: var(--panel-hover); border-color: #5b4a78; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.on { background: #1f4d36; border-color: var(--ok); color: #d8ffe9; }
  .count { color: var(--muted); margin-left: 6px; }
  button.on .count { color: #a6e8c4; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 7px; }
</style>
</head>
<body>
<div id="bar"></div>
<script src="bar.js"></script>
</body>
</html>

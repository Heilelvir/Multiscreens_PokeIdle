name: Build e Release
# Quem usa o app NÃO precisa de Node/npm: baixa o instalador na página de Releases.
# Para publicar uma versão: crie uma tag (ex.: v1.0.0) ou rode manualmente em Actions > Build e Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # necessário só para publicar o Release

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist
      - name: Hash SHA256
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: instalador, path: "dist/*.exe\ndist/SHA256SUMS.txt" }
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" dist/*.exe dist/SHA256SUMS.txt --title "${{ github.ref_name }}" --generate-notes
